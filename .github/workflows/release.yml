name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  package:
    name: package the Windows download
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Make the checkout preserve the committed line endings
        run: |
          git config --global core.autocrlf false
          $autocrlf = git config --get core.autocrlf
          if ($autocrlf -ne "false") { throw "the checkout would convert line endings: core.autocrlf reads $autocrlf, not false" }

      - name: Check out the repository without keeping a credential (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Put the temporary root on the checkout's volume
        run: |
          $volume = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          if (-not $volume) { throw "GITHUB_WORKSPACE names no volume, so the temporary root cannot share it" }
          $root = Join-Path $volume "tmp"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$root"

      - name: Install Python 3.12 (actions/setup-python v5.6.0)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the packaging extras
        run: python -m pip install --quiet --disable-pip-version-check -e ".[packaging]"

      - name: Refuse a tag that does not name the product version
        if: github.ref_type == 'tag'
        run: |
          $version = (python -m tools.webfoot.release_identity --json | ConvertFrom-Json).product.version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME is not v$version, the product version at this commit" }

      - name: Freeze the program
        run: |
          pwsh scripts/build-postboy-advance.ps1 -Clean
          if ($LASTEXITCODE -ne 0) { throw "the build failed with exit $LASTEXITCODE" }

      # A hosted runner has no ROM, so the byte probe and the packaged smoke stay local steps.
      - name: Stage, census and zip the download
        run: |
          pwsh scripts/package-postboy-advance.ps1 -SkipRomProbe
          if ($LASTEXITCODE -ne 0) { throw "packaging failed with exit $LASTEXITCODE" }

      - name: Keep the zip and its checksum with the run (actions/upload-artifact v4.6.2)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-download
          if-no-files-found: error
          path: |
            build/packaged/*.zip
            build/packaged/*.zip.sha256

      - name: Open a draft release that holds the zip and its checksum
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem build/packaged -File | Where-Object { $_.Name -match '\.zip(\.sha256)?$' } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 2) { throw "expected one zip and one checksum, found $($files.Count)" }
          gh release create $env:GITHUB_REF_NAME @files --draft --verify-tag --generate-notes --title "Postboy Advance $($env:GITHUB_REF_NAME.TrimStart('v'))"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit $LASTEXITCODE" }
